<div class="bg-white py-24 sm:py-32">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <div class="mx-auto max-w-2xl lg:mx-0">
      <h2 class="text-4xl font-semibold tracking-tight text-pretty text-gray-900 sm:text-5xl">From the blog</h2>
      <p class="mt-2 text-lg/8 text-gray-600">Learn how to grow your business with our expert advice.</p>
    </div>
    <div class="mx-auto mt-10 grid max-w-2xl grid-cols-1 gap-x-8 gap-y-16 border-t border-gray-200 pt-10 sm:mt-16 sm:pt-16 lg:mx-0 lg:max-w-none lg:grid-cols-3">
      <article class="flex max-w-xl flex-col items-start justify-between" *ngFor="let item of blogItem">
        <div class="flex items-center gap-x-4 text-xs">
         
          <time datetime="2020-03-16" class="text-gray-500">{{item.created_at|slice:0:10}}</time>
          <a href="#" class="relative z-10 rounded-full bg-gray-50 px-3 py-1.5 font-medium text-gray-600 hover:bg-gray-100">BLOG</a>
        </div>
        <div class="group relative grow">
            <img src="{{item.image}}" alt="">
          <h3 class="mt-3 text-lg/6 font-semibold text-gray-900 group-hover:text-gray-600">
            <a href="#">
              <span class="absolute inset-0"></span>
              {{item.title}}
            </a>
          </h3>
          <p class="mt-5 line-clamp-3 text-sm/6 text-gray-600">{{item.body | slice:0:120}}</p>
        </div>
        <div class="relative mt-8 flex items-center gap-x-4 justify-self-end">
          <img src="{{item.author.pic}}" alt="" class="size-10 rounded-full bg-gray-50" />
          <div class="text-sm/6">
            <p class="font-semibold text-gray-900">
              <a href="#">
                <span class="absolute inset-0"></span>
                {{item.author.name}}
              </a>
            </p>
            <p class="text-gray-600">
                <span *ngFor="let cat of item.category; let i = index">
    {{ cat.category_name }}<span *ngIf="i < item.category.length - 1">, </span>
  </span>
            </p>
          </div>
        </div>
      </article>

    </div>
  </div>
</div>
